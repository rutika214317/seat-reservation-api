spring.application.name=seat-reservation-api
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:seatreservation;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:seatreservation}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
logging.structured.format.console=logstash
app.security.basic.username=${ADMIN_USERNAME:admin}
app.security.basic.password=${ADMIN_PASSWORD:password}
